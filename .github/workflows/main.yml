name: Pipeline CI/CD Blog-Next

on:
  push:
    branches:
      - master
    paths:
      - "Blog-Next/**"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v6

      - name: Ver estrutura do projeto
        run: |
          pwd
          ls -la
          find . -name "package-lock.json"

      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./Blog-Next/package-lock.json

      - name: Instalar as Dependencias
        run: npm ci
        working-directory: ./Blog-Next

      - name: Rodar o build
        run: npm run build
        working-directory: ./Blog-Next


  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v6

      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./Blog-Next/package-lock.json

      - name: Instalar as Dependencias
        run: npm ci
        working-directory: ./Blog-Next

      - name: Rodar o Lint
        run: npm run lint
        working-directory: ./Blog-Next

      - name: Verificar formatação
        run: npm run format:check
        working-directory: ./Blog-Next

      - name: Rodar os testes
        run: npm run test
        working-directory: ./Blog-Next


  deploy:
    runs-on: ubuntu-latest
    needs: [build, tests]

    steps:
      - name: Checkout do Codigo
        uses: actions/checkout@v6

      - name: Instalação do Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Instalar Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy para Vercel
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./Blog-Next
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
